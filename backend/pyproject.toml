[project]
name = "devpilot-backend"
version = "0.1.0"
description = "DevPilot - AI developer platform powered by the Model Context Protocol"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "mcp>=1.12,<2",  # 2.x renames FastMCP/changes client APIs; we target the stable 1.x line
  "httpx>=0.27",
  "openai>=1.40",
  "cryptography>=42",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "../mcp_servers"]
python_files = ["test_*.py"]
pythonpath = ["..", ".", "backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
