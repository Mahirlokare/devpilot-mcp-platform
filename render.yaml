# Render Blueprint for DevPilot Backend + Managed PostgreSQL
# Deploy in one click via Render Dashboard -> New -> Blueprint
services:
  - type: web
    name: devpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEVPILOT_ENVIRONMENT
        value: production
      - key: DEVPILOT_DATABASE_URL
        fromDatabase:
          name: devpilot-db
          property: connectionString
      - key: DEVPILOT_JWT_SECRET
        generateValue: true
      - key: DEVPILOT_ENCRYPTION_KEY
        sync: false
      - key: DEVPILOT_ALLOW_REGISTRATION
        value: "true"
      - key: DEVPILOT_TERMINAL_SANDBOX
        value: process
      - key: DEVPILOT_TERMINAL_ALLOW_UNSANDBOXED
        value: "true"
      - key: DEVPILOT_CORS_ORIGINS
        value: '["*"]'
      - key: DEVPILOT_OPENAI_API_KEY
        sync: false

databases:
  - name: devpilot-db
    databaseName: devpilot
    user: devpilot
    plan: free
