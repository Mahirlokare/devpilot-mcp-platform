# Render Blueprint for DevPilot Full-Stack (React UI + FastAPI Backend + 7 MCP Servers)
services:
  - type: web
    name: devpilot-mcp-platform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEVPILOT_ENVIRONMENT
        value: development
      - key: DEVPILOT_DATABASE_URL
        value: sqlite+aiosqlite:////app/workspace/devpilot.db
      - key: DEVPILOT_ALLOW_REGISTRATION
        value: "true"
      - key: DEVPILOT_TERMINAL_SANDBOX
        value: process
      - key: DEVPILOT_CORS_ORIGINS
        value: '["*"]'
